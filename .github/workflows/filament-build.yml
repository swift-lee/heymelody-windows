name: Filament compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_native_rebuild:
        description: Bypass the cache and rebuild the Windows native runtime in the manual matrix.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: filament-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Native compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Normal package workflows own Windows/macOS native builds; manual diagnostics can cover all three.
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","macos-15","ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up the locked .NET SDK
        uses: ./.github/actions/setup-build-sdk
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build libegl-dev libgl-dev libgles-dev libvulkan1
      - name: Determine runtime ID
        id: runtime
        shell: pwsh
        run: |
          $prefix = if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' }
          $architecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($IsMacOS -and ($architecture -ne 'arm64' -or [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64')) {
            throw 'The supported macOS runtime requires an Apple silicon runner.'
          }
          "rid=$prefix-$architecture" >> $env:GITHUB_OUTPUT
      - name: Restore or build Windows runtime
        id: filament
        if: runner.os == 'Windows'
        uses: ./.github/actions/filament-runtime
        with:
          runtime-identifier: ${{ steps.runtime.outputs.rid }}
          force-rebuild: ${{ inputs.force_native_rebuild || false }}
      - name: Build the locked macOS or Linux runtime
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          if ($IsLinux) { $env:CC = 'clang'; $env:CXX = 'clang++' }
          ./tools/filament/Build-FilamentNative.ps1 -RuntimeIdentifier '${{ steps.runtime.outputs.rid }}' -OutputRoot artifacts/filament-compat -FetchSource -FetchBuildTools -SkipSmoke:$IsMacOS
      - name: Verify runtime files and real ABI load
        shell: pwsh
        env:
          WINDOWS_FILAMENT_ROOT: ${{ steps.filament.outputs.runtime-root }}
        run: |
          $runtimeRoot = if ($IsWindows) { $env:WINDOWS_FILAMENT_ROOT } else { Join-Path $env:GITHUB_WORKSPACE 'artifacts/filament-compat' }
          $native = Join-Path $runtimeRoot 'runtimes/${{ steps.runtime.outputs.rid }}/native'
          ./tools/Verify-FilamentRuntime.ps1 -Directory $native -RuntimeIdentifier '${{ steps.runtime.outputs.rid }}' -RequireCurrent | ConvertTo-Json
          dotnet run --project tests/HeyMelody.Rendering.Filament.Tests -c Release --disable-build-servers -p:UseSharedCompilation=false -- --native-abi $native --output-dir artifacts/filament-ci-checks/native-abi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check workflow contracts and portable rendering behavior
        shell: pwsh
        run: |
          ./tools/ci/tests/Test-CiContracts.ps1 -OutputPath artifacts/filament-ci-checks/ci-contracts.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/ci/Invoke-OfflineTests.ps1 -Profile Renderer -OutputRoot artifacts/filament-ci-checks/offline-tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload native compatibility payload
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: filament-${{ steps.runtime.outputs.rid }}
          path: artifacts/filament-compat/runtimes/${{ steps.runtime.outputs.rid }}/native/
          if-no-files-found: error
          retention-days: 2
      - name: Upload compatibility checks and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filament-checks-${{ steps.runtime.outputs.rid }}
          path: artifacts/filament-ci-checks/
          if-no-files-found: warn
          retention-days: 1
